<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 2 — Хэрэглэгчид</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <p class="eyebrow">Assignment 2</p>
        <h1>Хэрэглэгчид</h1>
      </header>

      <div class="sheet">
        <ul class="row row-head">
          <li class="cell col-num">№</li>
          <li class="cell col-photo">Цээж зураг</li>
          <li class="cell col-name">Хэрэглэгчийн нэр</li>
          <li class="cell col-hobbies">Хийх дуртай зүйлс</li>
        </ul>

        <ul class="row">
          <li class="cell num">1</li>
          <li class="cell photo-cell">
            <img
              class="photo"
              src="public/images/image1.png"
              alt="Хэрэглэгч 1-ийн цээж зураг"
            />
          </li>
          <li class="cell name">Намсрай Мөнхпүрэв</li>
          <li class="cell hobbies">
            <ul class="hobby-list">
              <li>Шоо эвлүүлэх</li>
              <li>Design гаргах</li>
              <li>Сэлэх</li>
            </ul>
          </li>
        </ul>

        <ul class="row">
          <li class="cell num">2</li>
          <li class="cell photo-cell">
            <img
              class="photo"
              src="public/images/image2.png"
              alt="Хэрэглэгч 2-ийн цээж зураг"
            />
          </li>
          <li class="cell name">Овог Нэр</li>
          <li class="cell hobbies">
            <ul class="hobby-list">
              <li>Дуртай зүйл 1</li>
              <li>Дуртай зүйл 2</li>
              <li>Дуртай зүйл 3</li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
